<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro Presenze 2050</title>

    <!-- === META PWA iOS === -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Registro Presenze">
    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- === META PWA ANDROID/CHROME === -->
    <meta name="theme-color" content="#343a40">
    <meta name="msapplication-TileColor" content="#343a40">
    
    <!-- === MANIFEST PWA === -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- === ICONE iOS === -->
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- === META DESCRIPTION === -->
    <meta name="description" content="Registro digitale presenze atleti - Gruppo Sportivo 2050">

    <!-- === LIBRERIE ESTERNE === -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <!-- === STILI CSS OTTIMIZZATI CON CELLE PIÙ GRANDI === -->
    <style>
        /* RESET */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow-x: hidden; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }
        
        /* CONTENITORE PRINCIPALE */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 15px 40px;
            min-height: 100vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }
        
        /* HEADER */
        .header { 
            text-align: center; 
            margin-bottom: 25px; 
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .logo { 
            max-height: 150px; 
            max-width: 95%; 
            height: auto; 
            border-radius: 15px; 
            margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        /* TOP BAR */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .date-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 15px;
        }
        
        select, input { 
            padding: 12px 18px; 
            border-radius: 12px; 
            border: 2px solid #e0e0e0; 
            font-weight: 600; 
            font-size: 15px; 
            color: #333; 
            outline: none; 
            background: white;
            min-width: 130px;
            cursor: pointer;
        }
        
        /* PULSANTI AZIONE */
        .actions-container { 
            display: flex; 
            justify-content: center; 
            gap: 12px; 
            margin: 20px 0 25px; 
            flex-wrap: wrap; 
        }
        
        .btn-action { 
            padding: 14px 22px; 
            border-radius: 14px; 
            border: none; 
            font-weight: 900; 
            cursor: pointer; 
            color: white; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 15px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.2); 
            text-transform: uppercase; 
            transition: all 0.3s; 
        }
        
        .btn-action:active { transform: translateY(2px); }
        .btn-drive { background: linear-gradient(135deg, #4285F4, #0d47a1); } 
        .btn-open-drive { background: linear-gradient(135deg, #34a853, #1e7e34); } 
        .btn-admin { background: linear-gradient(135deg, #6c757d, #343a40); } 
        .btn-home { background: linear-gradient(135deg, #ff9800, #f57c00); }
        .btn-oggi { 
            background: linear-gradient(135deg, #17a2b8, #0f6674); 
            width: 52px; 
            height: 52px; 
            justify-content: center; 
            font-size: 24px; 
            border-radius: 14px; 
        }
        .btn-backup-auto { background: linear-gradient(135deg, #f39c12, #e67e22); }
        .btn-backup-auto.attivo { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .btn-numeric-input { background: linear-gradient(135deg, #8e44ad, #6c3483); }
        .btn-numeric-input.attivo { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        
        /* STATUS BAR */
        .status-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 20px;
            border-radius: 50px;
            margin: 20px 0 25px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        #status-auto { 
            font-size: 15px; 
            color: #2c3e50; 
            font-weight: 700; 
            background: #f8f9fa; 
            padding: 8px 20px; 
            border-radius: 30px; 
            display: inline-block;
        }
        
        .stats-info {
            display: flex;
            gap: 20px;
            font-size: 16px;
            font-weight: 700;
            color: #333;
        }
        .stats-info span { color: #667eea; font-size: 20px; margin-right: 5px; font-weight: 900; }
        
        /* MENU CATEGORIE */
        .menu-container { 
            display: flex; 
            flex-direction: column; 
            gap: 18px; 
            padding: 10px 0 25px; 
            width: 100%; 
        }
        
        .btn-menu { 
            width: 100%; 
            padding: 30px 20px; 
            font-weight: 900; 
            font-size: 24px; 
            border-radius: 30px; 
            color: white; 
            border: none; 
            cursor: pointer; 
            text-transform: uppercase; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.2); 
            transition: all 0.3s; 
            line-height: 1.4;
        }
        .btn-menu:active { transform: scale(0.98); }
        .btn-menu span {
            display: block;
            font-size: 14px;
            font-weight: 400;
            text-transform: none;
            opacity: 0.9;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }
        .btn-cuccioli { background: linear-gradient(135deg, #e91e63, #c2185b); } 
        .btn-piccoli { background: linear-gradient(135deg, #007bff, #0056b3); } 
        .btn-grandi { background: linear-gradient(135deg, #28a745, #1e7e34); }
        
        /* TABELLA CON CELLE PIÙ GRANDI */
        .section-container { display: none; width: 100%; margin-top: 20px; } 
        .section-active { display: block; }
        
        .table-container {
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        
        .table-wrapper { 
            overflow: auto; 
            max-height: 70vh; 
            border: 1px solid #e0e0e0; 
            border-radius: 15px; 
            background: white; 
            position: relative; 
            -webkit-overflow-scrolling: touch; 
        }
        
        table { 
            border-collapse: separate; 
            border-spacing: 0; 
            width: auto; 
            min-width: 100%; 
        }
        
        thead th { 
            position: sticky; 
            top: 0; 
            background: linear-gradient(135deg, #343a40, #1d2124) !important; 
            color: white !important; 
            z-index: 20; 
            padding: 15px 12px; /* Aumentato il padding */
            font-size: 14px; /* Aumentato leggermente */
            border: 1px solid #454d55; 
            text-align: center; 
            white-space: nowrap;
            font-weight: 700;
        }
        
        thead th.sticky-col { 
            position: sticky; 
            left: 0; 
            top: 0; 
            z-index: 30 !important; 
            background: linear-gradient(135deg, #343a40, #1d2124) !important;
            min-width: 180px; /* Aumentato da 150px a 180px */
        }
        
        .sticky-col { 
            position: sticky; 
            left: 0; 
            background: white !important; 
            z-index: 15; 
            border-right: 3px solid #667eea; 
            min-width: 180px; /* Aumentato da 150px a 180px */
            max-width: 180px; 
            padding: 15px 12px; /* Aumentato il padding */
            font-weight: 800; 
            font-size: 15px; /* Aumentato leggermente */
            text-align: left; 
        }
        
        .day-cell { 
            width: 70px; /* Aumentato da 55px a 70px */
            min-width: 70px; /* Aumentato da 55px a 70px */
            height: 70px; /* Aumentato da 55px a 70px */
            border: 1px solid #eaeef2; 
            text-align: center; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 20px; /* Aumentato da 18px a 20px */
            padding: 0; 
            user-select: none;
            transition: all 0.2s;
        }
        
        .p-partecipa { 
            background: linear-gradient(135deg, #2ecc71, #27ae60) !important; 
            color: white !important; 
            font-weight: 900;
        }
        
        .today-cell { 
            background: #d1ecf1; 
            border: 3px solid #0c5460 !important; 
        }
        
        .tot-cell { 
            position: sticky; 
            right: 0; 
            text-align: center; 
            font-weight: 900; 
            background: #f1f3f5 !important; 
            width: 70px; /* Aumentato da 60px a 70px */
            min-width: 70px; /* Aumentato da 60px a 70px */
            font-size: 20px; /* Aumentato da 18px a 20px */
            border-left: 3px solid #667eea; 
            z-index: 15; 
            color: #2c3e50;
            padding: 15px 0; /* Aggiunto padding verticale */
        }
        
        thead th:last-child { 
            position: sticky; 
            right: 0; 
            z-index: 30 !important; 
            background: linear-gradient(135deg, #343a40, #1d2124) !important; 
            border-left: 3px solid #667eea;
            min-width: 70px; /* Allineato con la larghezza delle celle */
        }
        
        /* FOOTER SEMPLIFICATO - SENZA LINK */
        .app-footer {
            margin-top: 40px;
            padding: 30px 20px 20px;
            background: white;
            border-radius: 20px;
            text-align: center;
        }
        
        .copyright {
            color: #adb5bd;
            font-size: 13px;
            line-height: 1.6;
        }
        
        /* PANNELLO ADMIN */
        #admin-overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.8); 
            backdrop-filter: blur(10px); 
            z-index: 1000; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }
        
        #admin-panel { 
            background: white; 
            width: 100%; 
            max-width: 700px; 
            padding: 35px; 
            border-radius: 30px; 
            box-shadow: 0 30px 70px rgba(0,0,0,0.4); 
            position: relative; 
            max-height: 90vh; 
            display: flex; 
            flex-direction: column; 
        }
        
        .close-admin { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            font-size: 30px; 
            cursor: pointer; 
            color: #999; 
            background: #f0f0f0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* INPUT NUMERICO */
        .number-input-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .number-input-container {
            background: white;
            padding: 35px;
            border-radius: 30px;
            text-align: center;
            min-width: 320px;
            max-width: 95%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }
        
        .number-input {
            width: 100%;
            font-size: 48px;
            text-align: center;
            border: 4px solid #2ecc71;
            border-radius: 20px;
            padding: 20px;
            margin: 25px 0;
            font-weight: bold;
            background: #f8f9fa;
        }
        
        /* LISTA ATLETI ADMIN */
        .atleta-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 18px; 
            border-bottom: 1px solid #e9ecef; 
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .atleta-item.archiviato { opacity: 0.7; background: #e9ecef; }
        .atleta-info { flex: 1; min-width: 200px; }
        .atleta-name { font-weight: 800; font-size: 16px; display: block; color: #2c3e50; }
        .atleta-cat { font-size: 13px; color: #667eea; font-weight: 600; }
        
        /* RESPONSIVE - CELLE ADATTIVE PER SCHERMI PICCOLI */
        @media (max-width: 768px) {
            .app-container { padding: 15px 10px 30px; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .sticky-col { min-width: 160px; max-width: 160px; font-size: 14px; }
            .day-cell { 
                width: 60px; /* Più grandi anche su mobile */
                min-width: 60px; 
                height: 60px; 
                font-size: 18px; 
            }
            .tot-cell { 
                width: 60px; 
                min-width: 60px; 
                font-size: 18px; 
            }
            .btn-menu { padding: 25px 15px; font-size: 22px; }
            .btn-menu span { font-size: 12px; }
        }
        
        /* PER SCHERMI MOLTO PICCOLI */
        @media (max-width: 480px) {
            .day-cell { 
                width: 55px; /* Leggermente ridotto ma sempre più grande dell'originale */
                min-width: 55px; 
                height: 55px; 
                font-size: 16px; 
            }
            .sticky-col { 
                min-width: 140px; 
                max-width: 140px; 
                font-size: 13px; 
                padding: 12px 8px;
            }
            thead th { 
                font-size: 12px; 
                padding: 12px 8px; 
            }
        }
        
        /* ANIMAZIONI CARICAMENTO */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

            <!-- TOP BAR CON CONTROLLI -->
            <div class="top-bar">
                <div class="date-controls">
                    <select id="select-mese" onchange="cambiaData()"></select>
                    <select id="select-anno" onchange="cambiaData()"></select>
                    <button class="btn-action btn-oggi" onclick="scrollOggi()" title="Vai a oggi">🎯</button>
                </div>
                <button class="btn-action btn-home" onclick="vaiAllaHome()" title="Home">🏠 HOME</button>
            </div>
            
            <!-- STATUS BAR CON STATISTICHE BASE -->
            <div class="status-container">
                <div id="status-auto">✅ Sistema Pronto</div>
                <div class="stats-info">
                    <div><span id="stat-atleti">0</span> Atleti</div>
                    <div><span id="stat-presenze-oggi">0</span> Oggi</div>
                    <div><span id="stat-presenze-mese">0</span> Questo Mese</div>
                </div>
            </div>
            
            <!-- PULSANTI AZIONE -->
            <div class="actions-container">
                <button class="btn-action btn-drive" onclick="aggiornaBackupDrive()" title="Crea backup PDF">☁️ BACKUP PDF</button>
                <button class="btn-action btn-open-drive" onclick="apriFileDrive()" title="Apri ultimo backup">📂 APRI DRIVE</button>
                <button class="btn-action btn-numeric-input" onclick="toggleNumericInput()" id="btn-numeric-input" title="Input numerico">🔢 NUM OFF</button>
                <button class="btn-action btn-backup-auto attivo" onclick="toggleBackupAutomatico()" id="btn-backup-auto" title="Backup automatico">▶️ AUTO ON</button>
                <button class="btn-action btn-admin" onclick="toggleAdmin()" title="Gestione atleti">⚙️ GESTISCI ATLETI</button>
            </div>
        </div>

        <!-- === MENU PRINCIPALE CATEGORIE CON SOTTOCATEGORIE === -->
        <div class="menu-container" id="main-menu">
            <button class="btn-menu btn-cuccioli" onclick="mostraSezione('cuccioli')">
                🧸 CUCCIOLI
                <span>CUCCIOLI</span>
            </button>
            <button class="btn-menu btn-piccoli" onclick="mostraSezione('piccoli')">
                👦 PICCOLI
                <span>GIOVANISSIMI • ESORDIENTI</span>
            </button>
            <button class="btn-menu btn-grandi" onclick="mostraSezione('grandi')">
                🏃 GRANDI
                <span>R12 • RAGAZZI • ALLIEVI • JUNIOR • SENIOR</span>
            </button>
        </div>

        <!-- === SEZIONI TABELLE === -->
        <div id="sez-cuccioli" class="section-container">
            <div class="table-container">
                <div class="table-wrapper" id="wrapper-cuccioli" onscroll="handleVirtualScroll('cuccioli')">
                    <table id="tab-cuccioli">
                        <thead id="thead-cuccioli"></thead>
                        <tbody id="tbody-cuccioli"></tbody>
                    </table>
                </div>
                <div style="text-align: center; padding: 15px; color: #666; font-size: 14px;">
                    <span id="virtual-info-cuccioli"></span>
                </div>
            </div>
        </div>
        
        <div id="sez-piccoli" class="section-container">
            <div class="table-container">
                <div class="table-wrapper" id="wrapper-piccoli" onscroll="handleVirtualScroll('piccoli')">
                    <table id="tab-piccoli">
                        <thead id="thead-piccoli"></thead>
                        <tbody id="tbody-piccoli"></tbody>
                    </table>
                </div>
                <div style="text-align: center; padding: 15px; color: #666; font-size: 14px;">
                    <span id="virtual-info-piccoli"></span>
                </div>
            </div>
        </div>
        
        <div id="sez-grandi" class="section-container">
            <div class="table-container">
                <div class="table-wrapper" id="wrapper-grandi" onscroll="handleVirtualScroll('grandi')">
                    <table id="tab-grandi">
                        <thead id="thead-grandi"></thead>
                        <tbody id="tbody-grandi"></tbody>
                    </table>
                </div>
                <div style="text-align: center; padding: 15px; color: #666; font-size: 14px;">
                    <span id="virtual-info-grandi"></span>
                </div>
            </div>
        </div>

        <!-- === FOOTER SEMPLIFICATO - SENZA LINK === -->
        <div class="app-footer">
            <div class="copyright">
                © 2024-2025 Gruppo Sportivo 2050 - Registro Presenze Digitale<br>
                <small>Ultimo aggiornamento: <span id="last-update">Caricamento...</span></small>
            </div>
        </div>
    </div>

    <!-- === PANNELLO ADMIN === -->
    <div id="admin-overlay">
        <div id="admin-panel">
            <span class="close-admin" onclick="toggleAdmin()">&times;</span>
            <h2 style="margin-bottom: 25px; color: #343a40; font-size: 28px;">👤 GESTIONE ATLETI</h2>
            
            <div id="admin-form" style="background: #f8f9fa; padding: 25px; border-radius: 20px; margin-bottom: 25px;">
                <input type="hidden" id="edit-id">
                
                <input type="text" id="new-nome" placeholder="NOME E COGNOME" 
                       style="width:100%; margin-bottom:15px; padding: 15px; border: 2px solid #ddd; border-radius: 12px; font-size: 16px; outline: none;">
                
                <select id="new-cat" style="width:100%; margin-bottom:20px; padding: 15px; border: 2px solid #ddd; border-radius: 12px; font-size: 16px; outline: none;">
                    <option value="CUCCIOLI">CUCCIOLI</option>
                    <option value="GIOVANISSIMI">GIOVANISSIMI</option>
                    <option value="ESORDIENTI">ESORDIENTI</option>
                    <option value="R12">R12</option>
                    <option value="RAGAZZI">RAGAZZI</option>
                    <option value="ALLIEVI">ALLIEVI</option>
                    <option value="JUNIOR">JUNIOR</option>
                    <option value="SENIOR">SENIOR</option>
                </select>
                
                <button id="btn-save-atleta" class="btn-action" 
                        style="width:100%; justify-content:center; padding: 16px; font-size: 18px; background: linear-gradient(135deg, #34a853, #1e7e34);" 
                        onclick="salvaAtleta()">
                    ➕ AGGIUNGI ATLETA
                </button>
                
                <button id="btn-cancel-edit" 
                        style="display:none; width:100%; margin-top:12px; background:transparent; border:none; color:#666; font-size:15px; cursor:pointer; padding: 12px;" 
                        onclick="resetForm()">
                    ❌ ANNULLA MODIFICA
                </button>
            </div>

    <script>
        // =================== CONFIGURAZIONE ===================
        const SB_URL = 'https://jiktdsvwerqstrlthwxu.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imppa3Rkc3Z3ZXJxc3RybHRod3h1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgyNDkxMDEsImV4cCI6MjA4MzgyNTEwMX0.wmEnME6GaHXrvLoQH7MDijiTU4dZfoi9wOcrqs9fP10';
        const WEB_APP_DRIVE_URL = "https://script.google.com/macros/s/AKfycbx1mEyj7Ul-XjAS1EwIZybiHDc2ti1TLe9fY22nTpxK_W0eAgOWwcSEltvoerB6YuB8WQ/exec";

        // =================== VARIABILI GLOBALI ===================
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        let dataAttuale = new Date();
        let atletiCache = [];
        let presenzePerMese = {};
        let mesiCaricati = new Set();
        let timerBackup = null;
        let secondiMancanti = 10;
        
        // Aggiornato rowHeight per celle più grandi (70px invece di 55px)
        const virtualScrollStates = {
            cuccioli: { startIndex: 0, endIndex: 0, rowHeight: 70, visibleRows: 15, totalRows: 0, container: null },
            piccoli: { startIndex: 0, endIndex: 0, rowHeight: 70, visibleRows: 15, totalRows: 0, container: null },
            grandi: { startIndex: 0, endIndex: 0, rowHeight: 70, visibleRows: 15, totalRows: 0, container: null }
        };
        
        let longPressTimer = null;
        let isLongPress = false;
        const LONG_PRESS_DURATION = 500;
        let currentCellData = null;
        
        let backupAutomaticoAttivo = true;
        let numericInputAttivo = false;
        
        const nomiMesi = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", 
                          "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
        const nomiGiorni = ["Dom", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab"];
        const CAT_CUCCIOLI = ['CUCCIOLI'];
        const CAT_PICCOLI = ['GIOVANISSIMI', 'ESORDIENTI'];
        const CAT_GRANDI = ['R12', 'RAGAZZI', 'ALLIEVI', 'JUNIOR', 'JUNIORES', 'SENIOR'];

        // =================== FUNZIONI CARICAMENTO MENSILE ===================

        async function caricaMese(anno, mese, force = false) {
            const key = `${anno}-${mese}`;
            
            if (!force && presenzePerMese[key]) {
                return presenzePerMese[key];
            }
            
            try {
                const primoGiorno = `${anno}-${String(mese+1).padStart(2,'0')}-01`;
                const ultimoGiorno = `${anno}-${String(mese+1).padStart(2,'0')}-${new Date(anno, mese+1, 0).getDate()}`;
                
                const { data, error } = await supabaseClient
                    .from('presenze')
                    .select('*')
                    .gte('data', primoGiorno)
                    .lte('data', ultimoGiorno);
                
                if (error) throw error;
                
                presenzePerMese[key] = data || [];
                mesiCaricati.add(key);
                
                return presenzePerMese[key];
                
            } catch (error) {
                console.error(`❌ Errore caricamento mese ${mese+1}:`, error);
                return [];
            }
        }

        async function caricaMesiVicini(anno, meseCentrale, raggio = 1) {
            const mesiDaCaricare = [];
            for (let i = -raggio; i <= raggio; i++) {
                let m = meseCentrale + i;
                let a = anno;
                
                if (m < 0) {
                    m = 11;
                    a = anno - 1;
                } else if (m > 11) {
                    m = 0;
                    a = anno + 1;
                }
                
                const key = `${a}-${m}`;
                if (!mesiCaricati.has(key)) {
                    mesiDaCaricare.push(caricaMese(a, m));
                }
            }
            
            if (mesiDaCaricare.length > 0) {
                document.getElementById('status-auto').innerHTML = `<span class="loading-spinner"></span> Caricamento dati...`;
                await Promise.all(mesiDaCaricare);
                document.getElementById('status-auto').innerText = "✅ Sistema Pronto";
            }
        }

        function getPresenzeMese(anno, mese) {
            const key = `${anno}-${mese}`;
            return presenzePerMese[key] || [];
        }

        // =================== FUNZIONI DI RENDERING ===================

        function renderHeader(sezione) {
            const anno = dataAttuale.getFullYear();
            const mese = dataAttuale.getMonth();
            const giorniMese = new Date(anno, mese + 1, 0).getDate();
            
            const thead = document.getElementById(`thead-${sezione}`);
            if (!thead) return;
            
            let head = `<tr><th class="sticky-col">ATLETA</th>`;
            for(let i = 1; i <= giorniMese; i++) {
                const giorno = new Date(anno, mese, i);
                head += `<th>${nomiGiorni[giorno.getDay()]}<br>${i}</th>`;
            }
            head += `<th>TOT</th></tr>`;
            thead.innerHTML = head;
        }

        function getAtletiFiltrati(sezione) {
            const cats = sezione === 'cuccioli' ? CAT_CUCCIOLI : 
                        (sezione === 'piccoli' ? CAT_PICCOLI : CAT_GRANDI);
            
            return atletiCache.filter(a => 
                cats.includes((a.categoria || "").trim().toUpperCase()) && 
                (a.archiviato === false || a.archiviato === null)
            );
        }

        function renderVirtualScroll(sezione) {
            const tbody = document.getElementById(`tbody-${sezione}`);
            const infoSpan = document.getElementById(`virtual-info-${sezione}`);
            if (!tbody) return;
            
            renderHeader(sezione);
            
            const atletiFiltrati = getAtletiFiltrati(sezione);
            const totalRows = atletiFiltrati.length;
            virtualScrollStates[sezione].totalRows = totalRows;
            
            if (totalRows === 0) {
                tbody.innerHTML = `<tr><td colspan="100" style="text-align: center; padding: 50px; color: #666; font-size: 16px;">
                    Nessun atleta in questa categoria
                </td></tr>`;
                if (infoSpan) infoSpan.innerHTML = '0 atleti';
                return;
            }
            
            const wrapper = document.getElementById(`wrapper-${sezione}`);
            if (wrapper && virtualScrollStates[sezione].rowHeight) {
                const scrollTop = wrapper.scrollTop;
                const wrapperHeight = wrapper.clientHeight;
                
                const startIndex = Math.max(0, Math.floor(scrollTop / virtualScrollStates[sezione].rowHeight) - 5);
                const endIndex = Math.min(totalRows, Math.ceil((scrollTop + wrapperHeight) / virtualScrollStates[sezione].rowHeight) + 5);
                
                virtualScrollStates[sezione].startIndex = startIndex;
                virtualScrollStates[sezione].endIndex = endIndex;
            }
            
            const { startIndex, endIndex, rowHeight } = virtualScrollStates[sezione];
            
            let html = '';
            const anno = dataAttuale.getFullYear();
            const mese = dataAttuale.getMonth();
            const giorniMese = new Date(anno, mese + 1, 0).getDate();
            const oggiStr = new Date().toLocaleDateString('en-CA');
            const presenzeMese = getPresenzeMese(anno, mese);
            
            for (let i = startIndex; i < endIndex && i < totalRows; i++) {
                const a = atletiFiltrati[i];
                html += `<tr style="height: ${rowHeight}px;">`;
                html += `<td class="sticky-col" title="${a.categoria}">${a.nome.toUpperCase()}</td>`;
                
                let totMese = 0;
                for(let d = 1; d <= giorniMese; d++) {
                    const dStr = `${anno}-${String(mese+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const p = presenzeMese.find(x => x.atleta_id === a.id && x.data === dStr);
                    
                    const hasNumber = p && p.stato && p.stato.includes('numero:');
                    const numberValue = hasNumber ? p.stato.split(':')[1] : '';
                    const isGreen = p && (p.stato === 'partecipa' || hasNumber);
                    
                    if(isGreen) totMese++;
                    
                    const longPressAttrs = numericInputAttivo ? 
                        `onmousedown="startLongPress(this, ${a.id}, '${dStr}', '${sezione}')" 
                         onmouseup="endLongPress()" 
                         onmouseleave="cancelLongPress()"
                         ontouchstart="startLongPress(this, ${a.id}, '${dStr}', '${sezione}')" 
                         ontouchend="endLongPress()" 
                         ontouchcancel="cancelLongPress()"` : '';
                    
                    html += `<td class="day-cell ${isGreen?'p-partecipa':''} ${dStr===oggiStr?'today-cell':''}" 
                        ${longPressAttrs}
                        onclick="handleCellClick(event, this, ${a.id}, '${dStr}', '${sezione}')"
                        title="${dStr}">
                        ${hasNumber ? numberValue : (isGreen ? '✔' : '')}
                    </td>`;
                }
                html += `<td class="tot-cell">${totMese}</td></tr>`;
            }
            
            tbody.innerHTML = html;
            
            const paddingTop = startIndex * rowHeight;
            const paddingBottom = (totalRows - endIndex) * rowHeight;
            
            let paddingTopEl = document.getElementById(`padding-top-${sezione}`);
            let paddingBottomEl = document.getElementById(`padding-bottom-${sezione}`);
            
            if (!paddingTopEl) {
                paddingTopEl = document.createElement('tr');
                paddingTopEl.id = `padding-top-${sezione}`;
                paddingTopEl.style.height = '0px';
                paddingTopEl.style.visibility = 'hidden';
                tbody.prepend(paddingTopEl);
            }
            paddingTopEl.style.height = paddingTop + 'px';
            
            if (!paddingBottomEl) {
                paddingBottomEl = document.createElement('tr');
                paddingBottomEl.id = `padding-bottom-${sezione}`;
                paddingBottomEl.style.height = '0px';
                paddingBottomEl.style.visibility = 'hidden';
                tbody.appendChild(paddingBottomEl);
            }
            paddingBottomEl.style.height = paddingBottom + 'px';
            
            if (infoSpan) {
                infoSpan.innerHTML = `Mostrando atleti ${startIndex+1}-${Math.min(endIndex, totalRows)} di ${totalRows}`;
            }
            
            aggiornaStatistiche();
        }

        function initVirtualScroll(sezione) {
            const wrapper = document.getElementById(`wrapper-${sezione}`);
            if (!wrapper) return;
            
            virtualScrollStates[sezione].container = wrapper;
            virtualScrollStates[sezione].rowHeight = 70; // Aumentato da 55 a 70
            
            const wrapperHeight = wrapper.clientHeight;
            virtualScrollStates[sezione].visibleRows = Math.ceil(wrapperHeight / 70) + 5; // Aumentato il divisore
            
            setTimeout(() => {
                renderVirtualScroll(sezione);
            }, 100);
        }

        function handleVirtualScroll(sezione) {
            if (!virtualScrollStates[sezione].container) return;
            
            const wrapper = virtualScrollStates[sezione].container;
            const scrollTop = wrapper.scrollTop;
            const rowHeight = virtualScrollStates[sezione].rowHeight;
            const totalRows = virtualScrollStates[sezione].totalRows;
            
            const startIndex = Math.max(0, Math.floor(scrollTop / rowHeight) - 5);
            const endIndex = Math.min(totalRows, Math.ceil((scrollTop + wrapper.clientHeight) / rowHeight) + 5);
            
            if (startIndex !== virtualScrollStates[sezione].startIndex || 
                endIndex !== virtualScrollStates[sezione].endIndex) {
                virtualScrollStates[sezione].startIndex = startIndex;
                virtualScrollStates[sezione].endIndex = endIndex;
                renderVirtualScroll(sezione);
            }
        }

        // =================== FUNZIONI PRINCIPALI ===================

        async function inizializza() {
            console.log('🚀 Inizializzazione applicazione...');
            
            const m = localStorage.getItem('p_mese') || dataAttuale.getMonth();
            const a = localStorage.getItem('p_anno') || dataAttuale.getFullYear();
            dataAttuale = new Date(a, m, 1);
            
            popolaSelettori(m, a);
            await caricaDatiIniziali();
            sottoscriviRealtime();
            
            setTimeout(() => {
                ['cuccioli', 'piccoli', 'grandi'].forEach(sez => {
                    initVirtualScroll(sez);
                });
            }, 500);
            
            const lastSez = sessionStorage.getItem('last_sez');
            if (lastSez) {
                mostraSezione(lastSez);
            } else {
                document.getElementById('main-menu').style.display = 'flex';
            }
            
            caricaStatoNumericInput();
            caricaStatoBackupAuto();
        }

        async function caricaDatiIniziali() {
            try {
                document.getElementById('status-auto').innerHTML = `<span class="loading-spinner"></span> Caricamento atleti...`;
                
                const { data: atleti, error: errorAtleti } = await supabaseClient
                    .from('atleti')
                    .select('*')
                    .order('nome');
                    
                if (errorAtleti) throw errorAtleti;
                atletiCache = atleti || [];
                
                await caricaMesiVicini(dataAttuale.getFullYear(), dataAttuale.getMonth(), 1);
                
                renderAdminList();
                
                document.getElementById('status-auto').innerText = "✅ Sistema Pronto";
                
            } catch (error) {
                console.error('❌ Errore caricamento dati:', error);
                document.getElementById('status-auto').innerText = "❌ Errore di connessione";
            }
        }

        function sottoscriviRealtime() {
            supabaseClient.channel('db-changes')
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'presenze' }, 
                    async (payload) => {
                        if (payload.new && payload.new.data) {
                            const data = new Date(payload.new.data);
                            const anno = data.getFullYear();
                            const mese = data.getMonth();
                            await caricaMese(anno, mese, true);
                            
                            if (anno === dataAttuale.getFullYear() && mese === dataAttuale.getMonth()) {
                                const sezione = getSezioneCorrente();
                                renderVirtualScroll(sezione);
                            }
                        }
                    })
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'atleti' }, 
                    async () => { 
                        const { data: atleti } = await supabaseClient.from('atleti').select('*').order('nome');
                        atletiCache = atleti || []; 
                        renderAdminList();
                        const sezione = getSezioneCorrente();
                        renderVirtualScroll(sezione);
                    })
                .subscribe();
        }

        function getSezioneCorrente() {
            if (document.getElementById('sez-cuccioli').classList.contains('section-active')) return 'cuccioli';
            if (document.getElementById('sez-piccoli').classList.contains('section-active')) return 'piccoli';
            if (document.getElementById('sez-grandi').classList.contains('section-active')) return 'grandi';
            return null;
        }

        function popolaSelettori(m, a) {
            const sm = document.getElementById('select-mese');
            const sa = document.getElementById('select-anno');
            
            sm.innerHTML = ""; 
            sa.innerHTML = "";
            
            nomiMesi.forEach((nome, i) => {
                sm.add(new Option(nome, i));
            });
            
            for(let i = 2024; i <= 2050; i++) {
                sa.add(new Option(i, i));
            }
            
            sm.value = m; 
            sa.value = a;
        }

        // =================== GESTIONE INPUT NUMERICO ===================

        function toggleNumericInput() {
            numericInputAttivo = !numericInputAttivo;
            const btn = document.getElementById('btn-numeric-input');
            
            if (numericInputAttivo) {
                btn.innerHTML = "🔢 NUM ON";
                btn.classList.add('attivo');
                document.getElementById('status-auto').innerText = "✅ Input numerico ATTIVATO";
            } else {
                btn.innerHTML = "🔢 NUM OFF";
                btn.classList.remove('attivo');
                document.getElementById('status-auto').innerText = "⏸️ Input numerico DISATTIVATO";
            }
            
            const sezione = getSezioneCorrente();
            if (sezione) renderVirtualScroll(sezione);
            localStorage.setItem('numeric_input_attivo', numericInputAttivo);
        }

        function caricaStatoNumericInput() {
            const savedState = localStorage.getItem('numeric_input_attivo');
            if (savedState !== null) {
                numericInputAttivo = savedState === 'true';
                const btn = document.getElementById('btn-numeric-input');
                if (numericInputAttivo) {
                    btn.innerHTML = "🔢 NUM ON";
                    btn.classList.add('attivo');
                } else {
                    btn.innerHTML = "🔢 NUM OFF";
                    btn.classList.remove('attivo');
                }
            }
        }

        // =================== GESTIONE LONG PRESS ===================

        function startLongPress(el, aId, data, sezione) {
            if (!numericInputAttivo) return;
            
            currentCellData = { el, aId, data, sezione };
            longPressTimer = setTimeout(() => {
                isLongPress = true;
                showNumberInput(el, aId, data, sezione);
            }, LONG_PRESS_DURATION);
        }

        function endLongPress() {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        }

        function cancelLongPress() {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        }

        function handleCellClick(event, el, aId, data, sezione) {
            event.preventDefault();
            event.stopPropagation();
            
            if (isLongPress) {
                isLongPress = false;
                return;
            }
            
            toggleCellState(el, aId, data, sezione);
        }

        async function toggleCellState(el, aId, data, sezione) {
            const anno = dataAttuale.getFullYear();
            const mese = dataAttuale.getMonth();
            const presenzeMese = getPresenzeMese(anno, mese);
            const p = presenzeMese.find(x => x.atleta_id === aId && x.data === data);
            
            if (p && p.stato && p.stato.includes('numero:')) {
                await supabaseClient.from('presenze').delete().eq('atleta_id', aId).eq('data', data);
                el.classList.remove('p-partecipa');
                el.innerText = '';
            } else if (p && p.stato === 'partecipa') {
                await supabaseClient.from('presenze').delete().eq('atleta_id', aId).eq('data', data);
                el.classList.remove('p-partecipa');
                el.innerText = '';
            } else {
                await supabaseClient.from('presenze').upsert({ 
                    atleta_id: aId, 
                    data: data, 
                    stato: 'partecipa' 
                }, { onConflict: 'atleta_id, data' });
                el.classList.add('p-partecipa');
                el.innerText = '✔';
            }
            
            const key = `${anno}-${mese}`;
            const idx = presenzePerMese[key]?.findIndex(x => x.atleta_id === aId && x.data === data);
            if (el.classList.contains('p-partecipa')) {
                if (idx > -1 && presenzePerMese[key]) {
                    presenzePerMese[key][idx].stato = 'partecipa';
                } else if (presenzePerMese[key]) {
                    presenzePerMese[key].push({ atleta_id: aId, data: data, stato: 'partecipa' });
                }
            } else if (idx > -1 && presenzePerMese[key]) {
                presenzePerMese[key].splice(idx, 1);
            }
            
            updateTotalCell(el, sezione);
            
            if (backupAutomaticoAttivo) {
                avviaTimerBackup();
            }
        }

        function showNumberInput(el, aId, data, sezione) {
            if (!numericInputAttivo) return;
            
            currentCellData = { el, aId, data, sezione };
            const anno = dataAttuale.getFullYear();
            const mese = dataAttuale.getMonth();
            const presenzeMese = getPresenzeMese(anno, mese);
            const p = presenzeMese.find(x => x.atleta_id === aId && x.data === data);
            let currentValue = '';
            
            if (p && p.stato && p.stato.includes('numero:')) {
                currentValue = p.stato.split(':')[1];
            }
            
            document.getElementById('number-input').value = currentValue;
            document.getElementById('number-input-overlay').style.display = 'flex';
            document.getElementById('number-input').focus();
            document.getElementById('number-input').select();
        }

        function clearNumberInput() {
            document.getElementById('number-input').value = '';
        }

        function cancelNumberInput() {
            document.getElementById('number-input-overlay').style.display = 'none';
            currentCellData = null;
        }

        async function confirmNumberInput() {
            const input = document.getElementById('number-input');
            const numberValue = input.value.trim();
            
            if (currentCellData && numberValue !== '') {
                const { el, aId, data, sezione } = currentCellData;
                const anno = dataAttuale.getFullYear();
                const mese = dataAttuale.getMonth();
                
                await supabaseClient.from('presenze').upsert({ 
                    atleta_id: aId, 
                    data: data, 
                    stato: `numero:${numberValue}`
                }, { onConflict: 'atleta_id, data' });
                
                el.classList.add('p-partecipa');
                el.innerText = numberValue;
                
                const key = `${anno}-${mese}`;
                const idx = presenzePerMese[key]?.findIndex(x => x.atleta_id === aId && x.data === data);
                if (idx > -1 && presenzePerMese[key]) {
                    presenzePerMese[key][idx].stato = `numero:${numberValue}`;
                } else if (presenzePerMese[key]) {
                    presenzePerMese[key].push({ atleta_id: aId, data: data, stato: `numero:${numberValue}` });
                }
                
                updateTotalCell(el, sezione);
                
                if (backupAutomaticoAttivo) {
                    avviaTimerBackup();
                }
            }
            
            document.getElementById('number-input-overlay').style.display = 'none';
            currentCellData = null;
        }

        function updateTotalCell(el, sezione) {
            const row = el.parentElement;
            if (!row) return;
            
            const totCell = row.querySelector('.tot-cell');
            if (!totCell) return;
            
            let total = 0;
            const dayCells = row.querySelectorAll('.day-cell');
            dayCells.forEach(cell => {
                if (cell.classList.contains('p-partecipa')) {
                    total++;
                }
            });
            
            totCell.innerText = total;
        }

        // =================== BACKUP AUTOMATICO ===================

        function avviaTimerBackup() {
            if (!backupAutomaticoAttivo) return;
            
            clearInterval(timerBackup); 
            secondiMancanti = 10;
            const status = document.getElementById('status-auto');
            
            timerBackup = setInterval(() => { 
                secondiMancanti--; 
                status.innerText = `⏳ BACKUP IN ${secondiMancanti}s...`; 
                if (secondiMancanti <= 0) { 
                    clearInterval(timerBackup); 
                    aggiornaBackupDrive(); 
                } 
            }, 1000);
        }

        function toggleBackupAutomatico() {
            backupAutomaticoAttivo = !backupAutomaticoAttivo;
            const btn = document.getElementById('btn-backup-auto');
            
            if (backupAutomaticoAttivo) {
                btn.innerHTML = "▶️ AUTO ON";
                btn.classList.add('attivo');
                document.getElementById('status-auto').innerText = "✅ Backup automatico ATTIVATO";
            } else {
                btn.innerHTML = "⏸️ AUTO OFF";
                btn.classList.remove('attivo');
                document.getElementById('status-auto').innerText = "⏸️ Backup automatico DISATTIVATO";
            }
            
            localStorage.setItem('backup_auto_attivo', backupAutomaticoAttivo);
        }

        function caricaStatoBackupAuto() {
            const savedState = localStorage.getItem('backup_auto_attivo');
            if (savedState !== null) {
                backupAutomaticoAttivo = savedState === 'true';
                const btn = document.getElementById('btn-backup-auto');
                if (backupAutomaticoAttivo) {
                    btn.innerHTML = "▶️ AUTO ON";
                    btn.classList.add('attivo');
                } else {
                    btn.innerHTML = "⏸️ AUTO OFF";
                    btn.classList.remove('attivo');
                }
            }
        }

        // =================== STATISTICHE ===================

        function aggiornaStatistiche() {
            const anno = dataAttuale.getFullYear();
            const mese = dataAttuale.getMonth();
            
            document.getElementById('total-atleti')?.remove();
            document.getElementById('total-presenze-anno')?.remove();
            document.getElementById('media-presenze')?.remove();
            document.getElementById('top-atleta')?.remove();
            
            document.getElementById('stat-atleti').innerText = atletiCache.length;
            
            const oggiStr = new Date().toLocaleDateString('en-CA');
            let presenzeOggi = 0;
            Object.values(presenzePerMese).forEach(mesePresenze => {
                presenzeOggi += mesePresenze.filter(p => p.data === oggiStr).length;
            });
            document.getElementById('stat-presenze-oggi').innerText = presenzeOggi;
            
            const presenzeMese = getPresenzeMese(anno, mese);
            document.getElementById('stat-presenze-mese').innerText = presenzeMese.length;
            
            document.getElementById('last-update').innerText = new Date().toLocaleString();
        }

        // =================== NAVIGAZIONE ===================

        function scrollOggi() {
            const active = document.querySelector('.section-active'); 
            if (!active) return;
            
            const target = active.querySelector('.today-cell'); 
            const wrapper = active.querySelector('.table-wrapper');
            const stickyWidth = active.querySelector('.sticky-col')?.offsetWidth || 180; // Aumentato da 150 a 180
            
            if (target && wrapper) {
                wrapper.scrollTo({ 
                    left: target.offsetLeft - stickyWidth - 20, 
                    behavior: 'smooth' 
                });
            }
        }

        function mostraSezione(s) {
            sessionStorage.setItem('last_sez', s); 
            document.getElementById('main-menu').style.display = 'none';
            
            document.getElementById('sez-cuccioli').className = 
                (s === 'cuccioli') ? 'section-active' : 'section-container';
            document.getElementById('sez-piccoli').className = 
                (s === 'piccoli') ? 'section-active' : 'section-container';
            document.getElementById('sez-grandi').className = 
                (s === 'grandi') ? 'section-active' : 'section-container';
            
            renderHeader(s);
            setTimeout(() => {
                renderVirtualScroll(s);
                scrollOggi();
            }, 100);
        }

        function vaiAllaHome() { 
            sessionStorage.removeItem('last_sez'); 
            location.reload(); 
        }

        async function cambiaData() { 
            const nuovoMese = parseInt(document.getElementById('select-mese').value);
            const nuovoAnno = parseInt(document.getElementById('select-anno').value);
            
            localStorage.setItem('p_mese', nuovoMese); 
            localStorage.setItem('p_anno', nuovoAnno); 
            
            dataAttuale = new Date(nuovoAnno, nuovoMese, 1);
            
            document.getElementById('status-auto').innerHTML = `<span class="loading-spinner"></span> Caricamento mese...`;
            await caricaMesiVicini(nuovoAnno, nuovoMese, 1);
            
            const sezione = getSezioneCorrente();
            if (sezione) {
                renderHeader(sezione);
                renderVirtualScroll(sezione);
            }
            document.getElementById('status-auto').innerText = "✅ Mese caricato";
            scrollOggi();
        }

        function toggleAdmin() { 
            const ov = document.getElementById('admin-overlay'); 
            ov.style.display = (ov.style.display === 'flex') ? 'none' : 'flex'; 
            
            if (ov.style.display === 'flex') {
                renderAdminList();
            }
        }

        function apriFileDrive() { 
            const url = localStorage.getItem('ultimo_pdf_url'); 
            if(url) {
                window.open(url, '_blank');
            } else {
                alert("Nessun backup trovato. Genera prima un backup.");
            }
        }

        // =================== BACKUP PDF ===================

        async function aggiornaBackupDrive() {
            const status = document.getElementById('status-auto'); 
            status.innerText = "📄 GENERAZIONE PDF...";
            
            try {
                const { jsPDF } = window.jspdf; 
                const doc = new jsPDF('l', 'mm', 'a4'); 
                const annoC = dataAttuale.getFullYear();
                
                for (let m = 0; m < 12; m++) {
                    if (m > 0) doc.addPage();
                    const g = new Date(annoC, m + 1, 0).getDate();
                    
                    await caricaMese(annoC, m);
                    
                    const header = [["ATLETA", ...Array.from({length: g}, (_, i) => 
                        `${nomiGiorni[new Date(annoC, m, i + 1).getDay()]}\n${i + 1}`), "TOT"]];
                    
                    doc.setFontSize(16); 
                    doc.setTextColor(52, 58, 64); 
                    doc.text(`REGISTRO PRESENZE - ${nomiMesi[m].toUpperCase()} ${annoC}`, 14, 12);
                    
                    const colStyles = { 
                        0: { halign: 'left', cellWidth: 35, fontStyle: 'bold' } 
                    };
                    const larghezzaGiorno = (260 - 35 - 10) / g;
                    for (let i = 1; i <= g; i++) colStyles[i] = { cellWidth: larghezzaGiorno };
                    colStyles[g + 1] = { cellWidth: 10, fillColor: [248, 249, 250], fontStyle: 'bold' };

                    const config = { 
                        head: header, 
                        startY: 20, 
                        theme: 'grid', 
                        tableWidth: 'wrap',
                        styles: { 
                            fontSize: 6, 
                            cellPadding: 1, 
                            halign: 'center', 
                            overflow: 'linebreak',
                            lineColor: [200, 200, 200] 
                        }, 
                        headStyles: { 
                            fillColor: [52, 58, 64], 
                            textColor: [255, 255, 255], 
                            fontStyle: 'bold', 
                            fontSize: 5.5 
                        }, 
                        columnStyles: colStyles, 
                        didParseCell: function(data) { 
                            if (data.section === 'body' && data.column.index > 0 && 
                                data.column.index <= g && data.cell.text[0] !== '') { 
                                if (data.cell.text[0] !== '✔' && !isNaN(parseInt(data.cell.text[0]))) {
                                    data.cell.styles.fillColor = [46, 204, 113];
                                    data.cell.styles.textColor = [255, 255, 255];
                                } else if (data.cell.text[0] === '✔') {
                                    data.cell.styles.fillColor = [46, 204, 113];
                                    data.cell.styles.textColor = [255, 255, 255];
                                }
                            } 
                        } 
                    };
                    
                    doc.autoTable({...config, body: preparaDatiPDF(CAT_CUCCIOLI, annoC, m, g)});
                    doc.autoTable({...config, body: preparaDatiPDF(CAT_PICCOLI, annoC, m, g), 
                                  startY: doc.lastAutoTable.finalY + 10});
                    doc.autoTable({...config, body: preparaDatiPDF(CAT_GRANDI, annoC, m, g), 
                                  startY: doc.lastAutoTable.finalY + 10});
                }
                
                const b64 = doc.output('datauristring').split(',')[1];
                status.innerText = "☁️ SALVATAGGIO SU DRIVE...";
                
                const resp = await fetch(WEB_APP_DRIVE_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ 
                        nomeFile: `Registro_Presenze_${annoC}.pdf`, 
                        blob: b64 
                    }) 
                });
                
                const res = await resp.json();
                if(res.fileUrl) { 
                    localStorage.setItem('ultimo_pdf_url', res.fileUrl); 
                    status.innerHTML = `✅ BACKUP COMPLETATO! <a href="${res.fileUrl}" target="_blank" style="color: #4285F4; font-weight: bold;">APRI PDF</a>`; 
                } else {
                    throw new Error('Nessun URL restituito');
                }
                
            } catch(e) { 
                status.innerText = "❌ ERRORE DURANTE IL BACKUP"; 
                console.error('Backup error:', e); 
            }
        }

        function preparaDatiPDF(cats, anno, mese, giorni) {
            const presenzeMese = getPresenzeMese(anno, mese);
            
            return atletiCache.filter(a => {
                const inCat = cats.includes((a.categoria || "").trim().toUpperCase());
                if (!inCat) return false;
                
                if (a.archiviato === false || a.archiviato === null) return true;
                
                const dInizio = `${anno}-${String(mese+1).padStart(2,'0')}-01`;
                const dFine = `${anno}-${String(mese+1).padStart(2,'0')}-${giorni}`;
                
                return presenzeMese.some(p => 
                    p.atleta_id === a.id && 
                    p.data >= dInizio && 
                    p.data <= dFine && 
                    (p.stato === 'partecipa' || p.stato.includes('numero:'))
                );
            }).map(a => {
                let riga = [a.nome.toUpperCase()], tot = 0;
                
                for(let d = 1; d <= giorni; d++) {
                    const dStr = `${anno}-${String(mese+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const p = presenzeMese.find(x => x.atleta_id === a.id && x.data === dStr);
                    
                    if(p) {
                        if (p.stato === 'partecipa') {
                            riga.push("✔");
                            tot++;
                        } else if (p.stato && p.stato.includes('numero:')) {
                            const num = p.stato.split(':')[1];
                            riga.push(num);
                            tot++;
                        } else {
                            riga.push("");
                        }
                    } else {
                        riga.push("");
                    }
                }
                riga.push(tot); 
                return riga;
            });
        }

        // =================== GESTIONE ATLETI ===================

        async function salvaAtleta() {
            const id = document.getElementById('edit-id').value;
            const nome = document.getElementById('new-nome').value.trim().toUpperCase();
            const cat = document.getElementById('new-cat').value;
            
            if(!nome) {
                alert("Inserisci il nome dell'atleta");
                return;
            }
            
            document.getElementById('status-auto').innerHTML = `<span class="loading-spinner"></span> Salvataggio...`;
            let res;
            
            try {
                if(id) {
                    res = await supabaseClient
                        .from('atleti')
                        .update({ nome, categoria: cat })
                        .eq('id', id);
                } else {
                    res = await supabaseClient
                        .from('atleti')
                        .insert([{ 
                            nome, 
                            categoria: cat, 
                            archiviato: false,
                            created_at: new Date().toISOString()
                        }]);
                }
                
                if (res.error) throw res.error;
                
                resetForm(); 
                const { data: atleti } = await supabaseClient.from('atleti').select('*').order('nome');
                atletiCache = atleti || []; 
                renderAdminList();
                
                const sezione = getSezioneCorrente();
                if (sezione) {
                    renderHeader(sezione);
                    renderVirtualScroll(sezione);
                }
                
                document.getElementById('status-auto').innerText = "✅ Atleta salvato";
                
            } catch(error) { 
                alert("Errore: " + error.message); 
                document.getElementById('status-auto').innerText = "❌ Errore salvataggio";
            }
        }

        function preparaModifica(id, nome, cat) {
            document.getElementById('edit-id').value = id;
            document.getElementById('new-nome').value = nome;
            document.getElementById('new-cat').value = cat;
            document.getElementById('btn-save-atleta').innerText = "💾 AGGIORNA ATLETA";
            document.getElementById('btn-cancel-edit').style.display = "block";
            document.getElementById('new-nome').focus();
        }

        function resetForm() {
            document.getElementById('edit-id').value = "";
            document.getElementById('new-nome').value = "";
            document.getElementById('new-cat').selectedIndex = 0;
            document.getElementById('btn-save-atleta').innerText = "➕ AGGIUNGI ATLETA";
            document.getElementById('btn-cancel-edit').style.display = "none";
        }

        function renderAdminList() {
            const container = document.getElementById('lista-atleti-admin');
            if (!container) return;
            
            if (atletiCache.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 30px; color: #666;">Nessun atleta registrato</div>';
                return;
            }
            
            container.innerHTML = atletiCache.map(a => `
                <div class="atleta-item ${a.archiviato ? 'archiviato' : ''}">
                    <div class="atleta-info">
                        <span class="atleta-name">${a.nome} ${a.archiviato ? '(ARCHIVIATO)' : ''}</span>
                        <span class="atleta-cat">${a.categoria}</span>
                    </div>
                    <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
                        <button style="background:#4285F4; color:white; border:none; padding:10px 16px; border-radius:10px; font-weight:bold; font-size:13px; cursor:pointer;" 
                            onclick="preparaModifica(${a.id}, '${a.nome.replace(/'/g, "\\'")}', '${a.categoria}')">
                            MODIFICA
                        </button>
                        <button style="background:${a.archiviato ? '#34a853' : '#f39c12'}; color:white; border:none; padding:10px 16px; border-radius:10px; font-weight:bold; font-size:13px; cursor:pointer;" 
                            onclick="setArchiviazione(${a.id}, ${!a.archiviato})">
                            ${a.archiviato ? 'RIPRISTINA' : 'ARCHIVIA'}
                        </button>
                        <button style="background:#e74c3c; color:white; border:none; padding:10px 16px; border-radius:10px; font-weight:bold; font-size:13px; cursor:pointer;" 
                            onclick="eliminaDefinitivo(${a.id})">
                            ELIMINA
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function setArchiviazione(id, stato) {
            try {
                await supabaseClient
                    .from('atleti')
                    .update({ archiviato: stato })
                    .eq('id', id);
                    
                const { data: atleti } = await supabaseClient.from('atleti').select('*').order('nome');
                atletiCache = atleti || []; 
                renderAdminList();
                
                const sezione = getSezioneCorrente();
                if (sezione) {
                    renderHeader(sezione);
                    renderVirtualScroll(sezione);
                }
                
                document.getElementById('status-auto').innerText = 
                    stato ? "✅ Atleta archiviato" : "✅ Atleta ripristinato";
                    
            } catch(error) {
                alert("Errore: " + error.message);
            }
        }

        async function eliminaDefinitivo(id) { 
            const atleta = atletiCache.find(a => a.id === id);
            if (!atleta) return;
            
            if(confirm(`ATTENZIONE! Eliminando definitivamente "${atleta.nome}" sparirà da TUTTI i registri passati e futuri.\n\nSei assolutamente sicuro?`)) { 
                try {
                    await supabaseClient.from('atleti').delete().eq('id', id); 
                    const { data: atleti } = await supabaseClient.from('atleti').select('*').order('nome');
                    atletiCache = atleti || []; 
                    renderAdminList();
                    
                    const sezione = getSezioneCorrente();
                    if (sezione) {
                        renderHeader(sezione);
                        renderVirtualScroll(sezione);
                    }
                    
                    document.getElementById('status-auto').innerText = "✅ Atleta eliminato";
                } catch(error) {
                    alert("Errore durante l'eliminazione: " + error.message);
                }
            } 
        }

        // =================== INIZIALIZZAZIONE ===================
        window.onload = inizializza;
    </script>
