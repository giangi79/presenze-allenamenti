<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Registro Presenze">
    <meta name="theme-color" content="#0a0c10">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="description" content="Registro digitale presenze atleti - Gruppo Sportivo 2050">

    <!-- Librerie -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <!-- Font e icone -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* ========== RESET & VARIABILI ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #0a0c10;
            --bg-card: #111317;
            --surface: #1a1d24;
            --surface-light: #23262f;
            --primary: #00f5d4;
            --primary-glow: rgba(0, 245, 212, 0.5);
            --secondary: #ff006e;
            --accent: #fb8b2c;
            --success: #00f5b0;
            --danger: #ff4d4d;
            --text: #edf2f7;
            --border: #2d2f36;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            --radius: 1.5rem;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 10% 20%, #0f1117, #07090e);
            color: var(--text);
            min-height: 100vh;
        }

        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--primary);
            color: #000;
            padding: 8px 16px;
            z-index: 10001;
            text-decoration: none;
            font-weight: bold;
            border-radius: 0 0 8px 0;
        }
        .skip-link:focus { top: 0; }

        .app-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px 20px 100px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 32px;
            background: rgba(17, 19, 23, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 245, 212, 0.2);
            border-radius: var(--radius);
            padding: 24px 20px;
            box-shadow: var(--shadow);
        }
        .logo {
            max-height: 100px;
            filter: drop-shadow(0 0 8px var(--primary-glow));
            transition: 0.3s;
        }
        .logo:hover { filter: drop-shadow(0 0 15px var(--primary)); }

        .top-bar {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .date-controls {
            display: flex;
            gap: 12px;
            background: var(--surface);
            padding: 8px 20px;
            border-radius: 60px;
            border: 1px solid var(--border);
        }
        select, input {
            background: var(--surface-light);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 40px;
            color: var(--text);
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
        }
        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        .status-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            border-radius: 80px;
            padding: 12px 24px;
            margin: 20px 0 30px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 15px;
        }
        #status-auto {
            background: var(--surface-light);
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-left: 3px solid var(--primary);
        }
        .stats-info {
            display: flex;
            gap: 28px;
            font-weight: 600;
        }
        .stats-info span {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            text-shadow: 0 0 5px var(--primary-glow);
            margin-right: 6px;
        }

        /* Menu categorie */
        .menu-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0 35px;
        }
        .btn-menu {
            flex: 1;
            min-width: 200px;
            padding: 24px 16px;
            font-weight: 800;
            font-size: 22px;
            border-radius: 60px;
            border: none;
            cursor: pointer;
            background: var(--surface);
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .btn-menu::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .btn-menu:hover::before { left: 100%; }
        .btn-menu:hover { transform: translateY(-4px); filter: brightness(1.05); }
        .btn-cuccioli { border-bottom: 4px solid #ff66c4; }
        .btn-piccoli { border-bottom: 4px solid var(--primary); }
        .btn-grandi { border-bottom: 4px solid var(--accent); }
        .btn-menu span {
            display: block;
            font-size: 12px;
            font-weight: 500;
            opacity: 0.7;
            margin-top: 10px;
        }

        .btn-piccoli.attenzione, .btn-grandi.attenzione {
            animation: pulseRed 1.2s infinite;
        }
        @keyframes pulseRed {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7); border-bottom-color: #ff4d4d; }
            70% { box-shadow: 0 0 0 12px rgba(255, 77, 77, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }

        /* Tabella */
        .section-container { display: none; margin-top: 20px; }
        .section-active { display: block; }
        .table-container {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .table-wrapper {
            overflow: auto;
            max-height: 70vh;
            scroll-behavior: smooth;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        thead th {
            position: sticky;
            top: 0;
            background: #0c0e13;
            color: var(--primary);
            padding: 16px 6px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 11px;
            border-bottom: 2px solid var(--primary);
        }
        th.sticky-col {
            position: sticky;
            left: 0;
            background: #0c0e13;
            z-index: 30;
            border-right: 2px solid var(--primary);
            min-width: 130px;
        }
        td.sticky-col {
            position: sticky;
            left: 0;
            background: var(--surface);
            font-weight: 700;
            border-right: 1px solid var(--border);
        }
        .nome-container {
            display: flex;
            justify-content: center;
            padding: 8px;
        }
        .nome-cognome {
            font-weight: 800;
            font-size: 13px;
            background: linear-gradient(135deg, #fff, var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .day-cell {
            width: 46px;
            min-width: 46px;
            height: 58px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .day-cell:hover {
            background: var(--primary);
            color: #000;
            transform: scale(0.96);
        }
        .p-partecipa {
            background: linear-gradient(145deg, #00c49a, #00f5b0);
            color: #000;
        }
        .p-assente {
            background: linear-gradient(145deg, #ff4d4d, #b91c1c);
            color: white;
        }
        .today-cell {
            border: 2px solid var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }
        .tot-cell {
            position: sticky;
            right: 0;
            background: #0f1117;
            font-weight: 800;
            text-align: center;
            border-left: 2px solid var(--primary);
            color: var(--primary);
        }
        thead th:last-child {
            position: sticky;
            right: 0;
            background: #0c0e13;
        }

        /* Bottom bar fluttuante */
        .bottom-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(17, 19, 23, 0.9);
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            display: flex;
            gap: 18px;
            border-radius: 80px;
            border: 1px solid rgba(0, 245, 212, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 100;
        }
        .btn-primary-bottom {
            background: linear-gradient(135deg, #1f2937, #111827);
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            color: var(--primary);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary-bottom:hover {
            background: var(--primary);
            color: #000;
            transform: scale(1.05);
        }
        .dropdown-menu { position: relative; }
        .dropdown-toggle {
            background: linear-gradient(135deg, #1f2937, #111827);
            padding: 10px 28px;
            border-radius: 40px;
            color: var(--primary);
            font-weight: 700;
            border: none;
            cursor: pointer;
        }
        .dropdown-content {
            position: absolute;
            bottom: 100%;
            left: 0;
            background: var(--surface);
            border-radius: 28px;
            padding: 12px;
            min-width: 240px;
            display: none;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .dropdown-content.show { display: block; animation: fadeUp 0.2s; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .dropdown-item {
            width: 100%;
            padding: 12px 16px;
            border-radius: 20px;
            background: var(--surface-light);
            color: white;
            font-weight: 600;
            margin-bottom: 8px;
            border: none;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }
        .dropdown-item:hover { background: var(--primary); color: #000; transform: translateX(5px); }

        /* Overlay */
        #admin-overlay, #number-input-overlay, #quick-register-overlay, #notifiche-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(16px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        #admin-panel, .notifiche-container, .quick-register-container, .number-input-container {
            background: var(--bg-card);
            border-radius: 40px;
            max-width: 600px;
            width: 90%;
            padding: 32px;
            border: 1px solid var(--primary);
            box-shadow: 0 0 40px rgba(0,245,212,0.2);
        }
        .quick-athlete-card {
            background: linear-gradient(135deg, #1f2937, #111827);
            border-radius: 40px;
            padding: 40px;
            margin: 20px 0;
            text-align: center;
            border: 1px solid var(--primary);
        }
        .quick-athlete-name { font-size: 32px; font-weight: 800; color: var(--primary); }
        .quick-btn {
            background: var(--surface-light);
            padding: 14px;
            border-radius: 40px;
            font-weight: bold;
            border: none;
            color: white;
            flex: 1;
            margin: 0 5px;
            transition: 0.2s;
        }
        .quick-btn-present { background: var(--success); color: #000; }
        .quick-btn-next, .quick-btn-prev { background: var(--accent); }

        @media (max-width: 768px) {
            .menu-container { flex-direction: column; }
            .btn-menu { min-width: auto; }
            .day-cell { width: 38px; min-width: 38px; height: 52px; font-size: 11px; }
            .bottom-bar { padding: 8px 16px; gap: 12px; bottom: 12px; }
            .btn-primary-bottom, .dropdown-toggle { padding: 8px 16px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Salta al contenuto</a>
    <div class="app-container" id="main-content">
        <div class="header">
            <img src="./logo.png" alt="Logo" class="logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MDAiIGhlaWdodD0iMTUwIiB2aWV3Qm94PSIwIDAgNDAwIDE1MCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0iIzBmMTExNyIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iTW9udHNlcnJhdCIgZm9udC1zaXplPSIzMiIgZmlsbD0iIzAwZjVkNCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPjIwNTA8L3RleHQ+PC9zdmc+'>
            <div class="top-bar">
                <div class="date-controls">
                    <select id="select-mese" onchange="cambiaData()"></select>
                    <select id="select-anno" onchange="cambiaData()"></select>
                    <button class="btn-primary-bottom" onclick="scrollOggi()">🎯 OGGI</button>

            <div class="status-container">
                <div id="status-auto">✅ Sistema Pronto</div>
                <div class="stats-info">
                    <div><span id="stat-atleti">0</span> Atleti</div>
                    <div><span id="stat-presenze-oggi">0</span> Oggi</div>
                    <div><span id="stat-presenze-mese">0</span> Mese</div>
                </div>
            </div>
        </div>

        <div class="menu-container" id="main-menu">
            <button class="btn-menu btn-cuccioli" onclick="mostraSezione('cuccioli')">🧸 CUCCIOLI<span>CUCCIOLI</span></button>
            <button class="btn-menu btn-piccoli" onclick="mostraSezione('piccoli')">👦 PICCOLI<span>GIOVANISSIMI · ESORDIENTI</span></button>
            <button class="btn-menu btn-grandi" onclick="mostraSezione('grandi')">🏃 GRANDI<span>R12 · RAGAZZI · ALLIEVI · JUNIOR · SENIOR</span></button>

        <div id="sez-cuccioli" class="section-container"><div class="table-container"><div class="table-wrapper" id="wrapper-cuccioli" onscroll="handleVirtualScroll('cuccioli')"><table id="tab-cuccioli"><thead id="thead-cuccioli"></thead><tbody id="tbody-cuccioli"></tbody></table></div><div style="text-align:center; padding:12px;"><span id="virtual-info-cuccioli"></span></div></div></div>
        <div id="sez-piccoli" class="section-container"><div class="table-container"><div class="table-wrapper" id="wrapper-piccoli" onscroll="handleVirtualScroll('piccoli')"><table id="tab-piccoli"><thead id="thead-piccoli"></thead><tbody id="tbody-piccoli"></tbody></table></div><div style="text-align:center; padding:12px;"><span id="virtual-info-piccoli"></span></div></div></div>
        <div id="sez-grandi" class="section-container"><div class="table-container"><div class="table-wrapper" id="wrapper-grandi" onscroll="handleVirtualScroll('grandi')"><table id="tab-grandi"><thead id="thead-grandi"></thead><tbody id="tbody-grandi"></tbody></table></div><div style="text-align:center; padding:12px;"><span id="virtual-info-grandi"></span></div></div></div>

        <div class="app-footer" style="text-align:center; margin-top:40px; opacity:0.7; font-size:12px;">
            © 2025 Gruppo Sportivo 2050 · <span id="last-update">Caricamento...</span>
            <div id="notification-status" style="margin-top:8px;"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <button class="btn-primary-bottom" onclick="vaiAllaHome()">🏠 HOME</button>
        <div class="dropdown-menu">
            <button class="dropdown-toggle" id="dropdownToggle" onclick="toggleDropdown(event)">☰ MENU ▼</button>
            <div class="dropdown-content" id="dropdownContent">
                <button class="dropdown-item" onclick="aggiornaBackupDrive(); closeDropdown()">☁️ BACKUP PDF</button>
                <button class="dropdown-item" onclick="apriFileDrive(); closeDropdown()">📂 APRI DRIVE</button>
                <button class="dropdown-item" onclick="toggleNumericInput(); closeDropdown()" id="dropdown-numeric">🔢 NUM OFF</button>
                <button class="dropdown-item" onclick="toggleBackupAutomatico(); closeDropdown()" id="dropdown-backup">▶️ AUTO ON</button>
                <button class="dropdown-item" onclick="toggleAdmin(); closeDropdown()">⚙️ GESTISCI ATLETI</button>
                <button class="dropdown-item" onclick="apriMenuNotifiche(); closeDropdown()">🔔 GESTISCI NOTIFICHE</button>
                <button class="dropdown-item install" id="dropdown-install" style="display:none;" onclick="installPWA(); closeDropdown()">📲 INSTALLA APP</button>
            </div>
        </div>
        <button class="btn-primary-bottom" onclick="avviaRegistrazioneVeloce()">⚡ REGISTRA</button>
    </div>

    <!-- Admin overlay -->
    <div id="admin-overlay">
        <div id="admin-panel">
            <span class="close-admin" onclick="toggleAdmin()">&times;</span>
            <h2>👤 GESTIONE ATLETI</h2>
            <div>
                <input type="hidden" id="edit-id">
                <input type="text" id="new-nome" placeholder="NOME E COGNOME" style="width:100%; margin-bottom:15px; padding:12px; border-radius:40px; border:1px solid var(--border); background:var(--surface-light); color:white;">
                <select id="new-cat" style="width:100%; margin-bottom:20px; padding:12px; border-radius:40px;">
                    <option value="CUCCIOLI">CUCCIOLI</option>
                    <option value="GIOVANISSIMI">GIOVANISSIMI</option>
                    <option value="ESORDIENTI">ESORDIENTI</option>
                    <option value="R12">R12</option>
                    <option value="RAGAZZI">RAGAZZI</option>
                    <option value="ALLIEVI">ALLIEVI</option>
                    <option value="JUNIOR">JUNIOR</option>
                    <option value="SENIOR">SENIOR</option>
                </select>
                <button id="btn-save-atleta" class="btn-primary-bottom" style="width:100%; justify-content:center; background:var(--success); color:#000;" onclick="salvaAtleta()">➕ AGGIUNGI ATLETA</button>
                <button id="btn-cancel-edit" style="display:none; width:100%; margin-top:12px; background:transparent; color:var(--text); border:1px solid var(--border); padding:10px; border-radius:40px;" onclick="resetForm()">❌ ANNULLA MODIFICA</button>
            </div>
            <div id="lista-atleti-admin" style="margin-top:20px; max-height:400px; overflow-y:auto;"></div>
        </div>
    </div>

    <!-- Numeric input overlay -->
    <div id="number-input-overlay">
        <div class="number-input-container">
            <h3>🔢 INSERISCI NUMERO</h3>
            <input type="number" id="number-input" class="number-input" min="0" max="999" value="1" style="width:100%; padding:20px; font-size:32px; text-align:center; margin:20px 0; border-radius:40px;">
            <div style="display:flex; gap:12px;">
                <button onclick="clearNumberInput()" style="background:#f97316; padding:12px; border-radius:40px; flex:1; border:none; color:white;">PULISCI</button>
                <button onclick="cancelNumberInput()" style="background:#ef4444; padding:12px; border-radius:40px; flex:1; border:none; color:white;">ANNULLA</button>
                <button onclick="confirmNumberInput()" style="background:#10b981; padding:12px; border-radius:40px; flex:1; border:none; color:white;">OK</button>
            </div>
        </div>
    </div>

    <!-- Quick register overlay -->
    <div id="quick-register-overlay">
        <div class="quick-register-container">
            <h2>📋 REGISTRA PRESENZE</h2>
            <div class="progress" id="quick-progress" style="margin:15px 0; font-weight:bold;"></div>
            <div class="quick-athlete-card" id="quick-athlete-card">
                <div class="quick-athlete-name" id="quick-athlete-name"></div>
                <div id="quick-athlete-category"></div>
            </div>
            <div class="quick-buttons" style="display:flex; gap:12px; margin:20px 0;">
                <button class="quick-btn quick-btn-prev" id="quick-btn-prev" onclick="prevQuickAthlete()">◀ INDIETRO</button>
                <button class="quick-btn quick-btn-present" id="quick-btn-present" onclick="toggleQuickPresent()">✅ PRESENTE</button>
                <button class="quick-btn quick-btn-next" id="quick-btn-next" onclick="nextQuickAthlete()">PROSSIMO ▶</button>
            </div>
            <div id="quick-status" style="margin:15px 0;"></div>
            <button class="quick-btn quick-btn-close" onclick="chiudiRegistrazioneVeloce()">✖️ CHIUDI</button>
        </div>
    </div>

    <!-- Notifiche overlay -->
    <div id="notifiche-overlay">
        <div class="notifiche-container">
            <span class="close-notifiche" onclick="chiudiMenuNotifiche()">&times;</span>
            <h2>🔔 GESTIONE NOTIFICHE</h2>
            <div id="notifiche-stato-generale" style="margin:15px 0; padding:12px; background:var(--surface); border-radius:40px; text-align:center;"></div>
            <div style="margin-bottom:20px;">
                <h3>⏰ ORARIO NOTIFICA</h3>

            <div style="margin-bottom:20px;">
                <h3>👦 GIORNI PICCOLI</h3>
                <div id="giorni-piccoli-container" class="giorni-container" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
            </div>
            <div style="margin-bottom:20px;">
                <h3>🏃 GIORNI GRANDI</h3>
                <div id="giorni-grandi-container" class="giorni-container" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
            </div>

        async function gestisciRichiesta(asyncFn, messaggioErrore, retryCount = 3) {
            for (let i = 0; i < retryCount; i++) {

        // =================== CARICAMENTO MENSILE ===================
        async function caricaMese(anno, mese, force = false) {
            const key = `${anno}-${mese}`;
            if (!force && presenzePerMese[key]) return presenzePerMese[key];
            try {
                const primoGiorno = `${anno}-${String(mese+1).padStart(2,'0')}-01`;
                const ultimoGiorno = `${anno}-${String(mese+1).padStart(2,'0')}-${new Date(anno, mese+1, 0).getDate()}`;
                const { data, error } = await gestisciRichiesta(() => supabaseClient.from('presenze').select('*').gte('data', primoGiorno).lte('data', ultimoGiorno), 'Errore nel caricamento delle presenze');
                if (error) throw error;
                presenzePerMese[key] = data || [];
                mesiCaricati.add(key);
                return presenzePerMese[key];
            } catch (error) {
                console.error(`Errore caricamento mese ${mese+1}:`, error);
                return [];
            }
        }

                if (m < 0) { m = 11; a = anno - 1; }
                else if (m > 11) { m = 0; a = anno + 1; }
                const key = `${a}-${m}`;
                if (!mesiCaricati.has(key)) mesiDaCaricare.push(caricaMese(a, m));
            }
            if (mesiDaCaricare.length > 0) {
                document.getElementById('status-auto').innerHTML = `<span class="loading-spinner"></span> Caricamento dati...`;
                await Promise.all(mesiDaCaricare);
                document.getElementById('status-auto').innerText = "✅ Sistema Pronto";
            }
        }

        function renderVirtualScroll(sezione) {
            const tbody = document.getElementById(`tbody-${sezione}`);
            const infoSpan = document.getElementById(`virtual-info-${sezione}`);
            if (!tbody) return;
            if (virtualScrollStates[sezione].renderTimeout) cancelAnimationFrame(virtualScrollStates[sezione].renderTimeout);
            virtualScrollStates[sezione].renderTimeout = requestAnimationFrame(() => {
                renderHeader(sezione);
                const atletiFiltrati = getAtletiFiltrati(sezione);
                const totalRows = atletiFiltrati.length;
                virtualScrollStates[sezione].totalRows = totalRows;
                if (totalRows === 0) {
                    tbody.innerHTML = `<tr><td colspan="100" style="text-align: center; padding: 50px;">Nessun atleta in questa categoria</td></tr>`;
                    if (infoSpan) infoSpan.innerHTML = '0 atleti';
                    return;
                }
                const wrapper = document.getElementById(`wrapper-${sezione}`);
                if (!wrapper) return;
                const scrollTop = wrapper.scrollTop, wrapperHeight = wrapper.clientHeight, rowHeight = virtualScrollStates[sezione].rowHeight, bufferSize = virtualScrollStates[sezione].bufferSize;
                const startIndex = Math.max(0, Math.floor(scrollTop / rowHeight) - bufferSize);
                const endIndex = Math.min(totalRows, Math.ceil((scrollTop + wrapperHeight) / rowHeight) + bufferSize);
                virtualScrollStates[sezione].startIndex = startIndex;
                virtualScrollStates[sezione].endIndex = endIndex;
                const paddingTop = startIndex * rowHeight;
                const paddingBottom = (totalRows - endIndex) * rowHeight;
                let html = '';
                if (paddingTop > 0) html += `<tr class="virtual-padding-row" style="height: ${paddingTop}px;"><td colspan="100"></td></tr>`;
                const anno = dataAttuale.getFullYear(), mese = dataAttuale.getMonth();
                const giorniMese = new Date(anno, mese + 1, 0).getDate();
                const oggi = new Date(), oggiStr = oggi.toLocaleDateString('en-CA'), oggiMezzanotte = new Date(oggi); oggiMezzanotte.setHours(0,0,0,0);
                const presenzeMese = getPresenzeMese(anno, mese);
                for (let i = startIndex; i < endIndex && i < totalRows; i++) {
                    const a = atletiFiltrati[i];
                    const categoriaClass = getCategoriaClass(a.categoria);
                    html += `<tr><td class="sticky-col ${categoriaClass}" scope="row"><div class="nome-container"><span class="nome-cognome">${a.nome.toUpperCase()}</span></div></td>`;
                    let totMese = 0;
                    for(let d = 1; d <= giorniMese; d++) {
                        const dStr = `${anno}-${String(mese+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                        const p = presenzeMese.find(x => x.atleta_id === a.id && x.data === dStr);
                        const hasNumber = p && p.stato && p.stato.includes('numero:');
                        const numberValue = hasNumber ? p.stato.split(':')[1] : '';
                        const isGreen = p && (p.stato === 'partecipa' || hasNumber);
                        if(isGreen) totMese++;
                        const longPressAttrs = numericInputAttivo ? `onmousedown="startLongPress(this, ${a.id}, '${dStr}', '${sezione}')" onmouseup="endLongPress()" onmouseleave="cancelLongPress()" ontouchstart="startLongPress(this, ${a.id}, '${dStr}', '${sezione}')" ontouchend="endLongPress()" ontouchcancel="cancelLongPress()"` : '';
                        let cellClass = '', cellContent = '';
                        const dataCella = new Date(anno, mese, d); dataCella.setHours(0,0,0,0);
                        if (isGreen) { cellClass = 'p-partecipa'; cellContent = hasNumber ? numberValue : '✔'; }
                        else { if (dataCella < oggiMezzanotte) { cellClass = 'p-assente'; cellContent = '✗'; } }
                        if (dStr === oggiStr) cellClass += ' today-cell';
                        html += `<td class="day-cell ${cellClass}" ${longPressAttrs} onclick="handleCellClick(event, this, ${a.id}, '${dStr}', '${sezione}')" title="${dStr}">${cellContent}</td>`;
                    }
                    html += `<td class="tot-cell">${totMese}</td></tr>`;

                if (paddingBottom > 0) html += `<tr class="virtual-padding-row" style="height: ${paddingBottom}px;"><td colspan="100"></td></tr>`;

                if (infoSpan) infoSpan.innerHTML = `Mostrando atleti ${startIndex+1}-${Math.min(endIndex, totalRows)} di ${totalRows}`;

        function initVirtualScroll(sezione) {
            const wrapper = document.getElementById(`wrapper-${sezione}`);
            if (!wrapper) return;
            virtualScrollStates[sezione].container = wrapper;
            wrapper.addEventListener('scroll', () => { handleVirtualScroll(sezione); });
            setTimeout(() => renderVirtualScroll(sezione), 100);
        }

        function handleVirtualScroll(sezione) {
            if (!virtualScrollStates[sezione].container) return;
            const wrapper = virtualScrollStates[sezione].container;
            const scrollTop = wrapper.scrollTop, rowHeight = virtualScrollStates[sezione].rowHeight, totalRows = virtualScrollStates[sezione].totalRows, bufferSize = virtualScrollStates[sezione].bufferSize, wrapperHeight = wrapper.clientHeight;
            const startIndex = Math.max(0, Math.floor(scrollTop / rowHeight) - bufferSize);
            const endIndex = Math.min(totalRows, Math.ceil((scrollTop + wrapperHeight) / rowHeight) + bufferSize);
            if (Math.abs(startIndex - virtualScrollStates[sezione].startIndex) > 3 || Math.abs(endIndex - virtualScrollStates[sezione].endIndex) > 3) {
                if (virtualScrollStates[sezione].renderTimeout) cancelAnimationFrame(virtualScrollStates[sezione].renderTimeout);
                virtualScrollStates[sezione].renderTimeout = requestAnimationFrame(() => { virtualScrollStates[sezione].startIndex = startIndex; virtualScrollStates[sezione].endIndex = endIndex; renderVirtualScroll(sezione); });
            }
        }

                document.getElementById('status-auto').innerHTML = `<span class="loading-spinner"></span> Caricamento atleti...`;

                if (errorAtleti) throw errorAtleti;
                atletiCache = atleti || [];

                renderAdminList();
                document.getElementById('status-auto').innerText = "✅ Sistema Pronto";
            } catch (error) { console.error('Errore caricamento dati:', error); document.getElementById('status-auto').innerText = "❌ Errore di connessione"; }
        }

        function sottoscriviRealtime() {
            supabaseClient.channel('db-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'presenze' }, async (payload) => {
                    if (payload.new && payload.new.data) {
                        const data = new Date(payload.new.data);
                        const anno = data.getFullYear(), mese = data.getMonth();
                        await caricaMese(anno, mese, true);
                        if (anno === dataAttuale.getFullYear() && mese === dataAttuale.getMonth()) {
                            const sezione = getSezioneCorrente();
                            renderVirtualScroll(sezione);
                            if (quickRegisterActive) aggiornaStatoVeloce();
                        }
                        controllaPresenzeGiornaliere();
                    }
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'atleti' }, async () => {
                    const { data: atleti } = await supabaseClient.from('atleti').select('*').order('nome');
                    atletiCache = atleti || [];
                    renderAdminList();
                    const sezione = getSezioneCorrente();
                    renderVirtualScroll(sezione);
                    if (quickRegisterActive) aggiornaListaVeloce();
                    const risultati = await getRisultatiControllo();
                    aggiornaBadgeNotifiche(risultati);
                })
                .subscribe();
        }

        function getSezioneCorrente() {
            if (document.getElementById('sez-cuccioli').classList.contains('section-active')) return 'cuccioli';

            if (document.getElementById('sez-grandi').classList.contains('section-active')) return 'grandi';

        function popolaSelettori(m, a) {

            const sa = document.getElementById('select-anno');

            sm.value = m; sa.value = a;
        }

        function toggleNumericInput() {
            numericInputAttivo = !numericInputAttivo;

        function startLongPress(el, aId, data, sezione) {
            if (!numericInputAttivo) return;
            currentCellData = { el, aId, data, sezione };
            longPressTimer = setTimeout(() => { isLongPress = true; showNumberInput(el, aId, data, sezione); }, LONG_PRESS_DURATION);
        }
        function endLongPress() { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } }
        function cancelLongPress() { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } }
        function handleCellClick(event, el, aId, data, sezione) { event.preventDefault(); event.stopPropagation(); if (isLongPress) { isLongPress = false; return; } toggleCellState(el, aId, data, sezione); }

        async function toggleCellState(el, aId, data, sezione) {
            const anno = dataAttuale.getFullYear(), mese = dataAttuale.getMonth();
            const presenzeMese = getPresenzeMese(anno, mese);
            const p = presenzeMese.find(x => x.atleta_id === aId && x.data === data);
            const oggi = new Date(); oggi.setHours(0,0,0,0);
            const [y, m, d] = data.split('-').map(Number);
            const dataCella = new Date(y, m-1, d); dataCella.setHours(0,0,0,0);
            try {
                if (p && p.stato && p.stato.includes('numero:')) {
                    await supabaseClient.from('presenze').delete().eq('atleta_id', aId).eq('data', data);
                    if (dataCella < oggi) { el.classList.remove('p-partecipa'); el.classList.add('p-assente'); el.innerText = '✗'; }
                    else { el.classList.remove('p-partecipa', 'p-assente'); el.innerText = ''; }
                } else if (p && p.stato === 'partecipa') {
                    await supabaseClient.from('presenze').delete().eq('atleta_id', aId).eq('data', data);
                    if (dataCella < oggi) { el.classList.remove('p-partecipa'); el.classList.add('p-assente'); el.innerText = '✗'; }
                    else { el.classList.remove('p-partecipa', 'p-assente'); el.innerText = ''; }
                } else {
                    await supabaseClient.from('presenze').upsert({ atleta_id: aId, data: data, stato: 'partecipa' }, { onConflict: 'atleta_id, data' });
                    el.classList.add('p-partecipa'); el.classList.remove('p-assente'); el.innerText = '✔';
                }
                const key = `${anno}-${mese}`;
                const idx = presenzePerMese[key]?.findIndex(x => x.atleta_id === aId && x.data === data);
                if (el.classList.contains('p-partecipa')) { if (idx > -1 && presenzePerMese[key]) presenzePerMese[key][idx].stato = 'partecipa'; else if (presenzePerMese[key]) presenzePerMese[key].push({ atleta_id: aId, data: data, stato: 'partecipa' }); }
                else if (idx > -1 && presenzePerMese[key]) presenzePerMese[key].splice(idx, 1);
                updateTotalCell(el, sezione);
                if (backupAutomaticoAttivo) avviaTimerBackup();
                controllaPresenzeGiornaliere();
            } catch (error) { console.error('Errore aggiornamento presenza:', error); }
        }

        function showNumberInput(el, aId, data, sezione) {
            if (!numericInputAttivo) return;
            currentCellData = { el, aId, data, sezione };
            const anno = dataAttuale.getFullYear(), mese = dataAttuale.getMonth();
            const presenzeMese = getPresenzeMese(anno, mese);
            const p = presenzeMese.find(x => x.atleta_id === aId && x.data === data);
            let currentValue = '';
            if (p && p.stato && p.stato.includes('numero:')) currentValue = p.stato.split(':')[1];
            document.getElementById('number-input').value = currentValue;
            document.getElementById('number-input-overlay').style.display = 'flex';

            document.getElementById('number-input').select();

        async function aggiornaBackupDrive() {
            const status = document.getElementById('status-auto'); status.innerText = "📄 GENERAZIONE PDF...";
            try {
                const { jsPDF } = window.jspdf; const doc = new jsPDF('l', 'mm', 'a4'); const annoC = dataAttuale.getFullYear(); const oggi = new Date();
                for (let m = 0; m < 12; m++) {
                    if (m > 0) doc.addPage();

                    await caricaMese(annoC, m);

                    doc.setFontSize(16); doc.setTextColor(52, 58, 64); doc.text(`REGISTRO PRESENZE - ${nomiMesi[m].toUpperCase()} ${annoC}`, 14, 12);

                    const larghezzaGiorno = (260 - 35 - 10) / g;
                    for (let i = 1; i <= g; i++) colStyles[i] = { cellWidth: larghezzaGiorno };
                    colStyles[g + 1] = { cellWidth: 10, fillColor: [248, 249, 250], fontStyle: 'bold' };
                    const config = { head: header, startY: 20, theme: 'grid', tableWidth: 'wrap', styles: { fontSize: 6, cellPadding: 1, halign: 'center', overflow: 'linebreak', lineColor: [200,200,200] }, headStyles: { fillColor: [52,58,64], textColor: [255,255,255], fontStyle: 'bold', fontSize: 5.5 }, columnStyles: colStyles, didParseCell: function(data) { if (data.section === 'body' && data.column.index > 0 && data.column.index <= g && data.cell.text[0] !== '') { if (data.cell.text[0] !== '✔' && !isNaN(parseInt(data.cell.text[0]))) { data.cell.styles.fillColor = [46,204,113]; data.cell.styles.textColor = [255,255,255]; } else if (data.cell.text[0] === '✔') { data.cell.styles.fillColor = [46,204,113]; data.cell.styles.textColor = [255,255,255]; } else if (data.cell.text[0] === '✗') { data.cell.styles.fillColor = [231,76,60]; data.cell.styles.textColor = [255,255,255]; } } } };
                    const preparaDati = (cats, anno, mese, giorni, oggi) => {
                        const presenzeMese = getPresenzeMese(anno, mese);
                        const oggiMezzanotte = new Date(oggi); oggiMezzanotte.setHours(0,0,0,0);
                        return atletiCache.filter(a => { const inCat = cats.includes((a.categoria || "").trim().toUpperCase()); if (!inCat) return false; if (a.archiviato === false || a.archiviato === null) return true; const dInizio = `${anno}-${String(mese+1).padStart(2,'0')}-01`; const dFine = `${anno}-${String(mese+1).padStart(2,'0')}-${giorni}`; return presenzeMese.some(p => p.atleta_id === a.id && p.data >= dInizio && p.data <= dFine && (p.stato === 'partecipa' || p.stato.includes('numero:'))); }).map(a => { let riga = [a.nome.toUpperCase()], tot = 0; for(let d = 1; d <= giorni; d++) { const dStr = `${anno}-${String(mese+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const p = presenzeMese.find(x => x.atleta_id === a.id && x.data === dStr); const dataCella = new Date(anno, mese, d); dataCella.setHours(0,0,0,0); if(p) { if (p.stato === 'partecipa') { riga.push("✔"); tot++; } else if (p.stato && p.stato.includes('numero:')) { const num = p.stato.split(':')[1]; riga.push(num); tot++; } else { if (dataCella < oggiMezzanotte) riga.push("✗"); else riga.push(""); } } else { if (dataCella < oggiMezzanotte) riga.push("✗"); else riga.push(""); } } riga.push(tot); return riga; });
                    };
                    doc.autoTable({...config, body: preparaDati(CAT_CUCCIOLI, annoC, m, g, oggi)});
                    doc.autoTable({...config, body: preparaDati(CAT_PICCOLI, annoC, m, g, oggi), startY: doc.lastAutoTable.finalY + 10});
                    doc.autoTable({...config, body: preparaDati(CAT_GRANDI, annoC, m, g, oggi), startY: doc.lastAutoTable.finalY + 10});
                }
                const b64 = doc.output('datauristring').split(',')[1];
                status.innerText = "☁️ SALVATAGGIO SU DRIVE...";
                const resp = await fetch(WEB_APP_DRIVE_URL, { method: 'POST', body: JSON.stringify({ nomeFile: `Registro_Presenze_${annoC}.pdf`, blob: b64 }) });
                const res = await resp.json();
                if(res.fileUrl) { localStorage.setItem('ultimo_pdf_url', res.fileUrl); status.innerHTML = `✅ BACKUP COMPLETATO! <a href="${res.fileUrl}" target="_blank" style="color: #00f5d4;">APRI PDF</a>`; }
                else throw new Error('Nessun URL restituito');
            } catch(e) { status.innerText = "❌ ERRORE DURANTE IL BACKUP"; console.error('Backup error:', e); }
        }

            if (!('serviceWorker' in navigator) || Notification.permission !== 'granted') { alert('Per testare le notifiche, devi prima accettare i permessi!'); return; }
            try {
                const registration = await navigator.serviceWorker.ready;
                await registration.showNotification('🔔 TEST NOTIFICA', { body: 'Questa è una notifica di test', icon: 'icon-192.png', badge: 'icon-72.png', vibrate: CONFIG_NOTIFICHE.VIBRAZIONE ? [200,100,200] : [], tag: 'test', renotify: CONFIG_NOTIFICHE.RENOTIFY, requireInteraction: true, actions: [{ action: 'open-piccoli', title: '👦 APRI PICCOLI' }, { action: 'open-grandi', title: '🏃 APRI GRANDI' }] });
                alert('✅ Notifica di test inviata!');
            } catch(error) { console.error(error); alert('❌ Errore nell\'invio della notifica'); }
        }
        async function initSistemaNotifiche() {
            if (!CONFIG_NOTIFICHE.ABILITATE) { aggiornaStatoNotificheUI('⏸️ Notifiche disattivate'); return false; }
            const swRegistrato = await registraServiceWorker();
            if (!swRegistrato) { aggiornaStatoNotificheUI('❌ Service Worker non registrato'); return false; }
            const permessi = await richiediPermessiNotifiche();
            if (!permessi) { aggiornaStatoNotificheUI('❌ Permessi negati'); return false; }
            setupMessageListener();
            avviaMonitoraggioPersonalizzato();
            aggiornaStatoNotificheUI('✅ Notifiche attive');
            return true;
        }
        async function registraServiceWorker() {
            if (!('serviceWorker' in navigator)) return false;
            try { const registration = await navigator.serviceWorker.register('sw.js', { scope: '/presenze-allenamenti/' }); console.log('Service Worker registrato'); await navigator.serviceWorker.ready; return true; }
            catch(error) { console.error(error); return false; }
        }
        async function richiediPermessiNotifiche() {
            if (!('Notification' in window)) return false;
            if (Notification.permission === 'granted') return true;
            if (Notification.permission === 'denied') return false;
            try { const permission = await Notification.requestPermission(); return permission === 'granted'; }
            catch(error) { return false; }
        }
        function setupMessageListener() { navigator.serviceWorker.addEventListener('message', (event) => { if (event.data.type === 'APRI_CATEGORIA') { const categoria = event.data.categoria; if (categoria === 'piccoli') mostraSezione('piccoli'); else if (categoria === 'grandi') mostraSezione('grandi'); if (document.hidden) window.focus(); setTimeout(scrollOggi,500); } }); }
        function avviaMonitoraggioPersonalizzato() { controllaPresenzeGiornaliere(); setInterval(controllaPresenzeGiornaliere, 60*60*1000); programmaControlloSerale(); programmaPuliziaTracciamento(); }
        function programmaControlloSerale() {
            const ora = new Date().getHours(), minuti = new Date().getMinutes();
            let msFinoAlle21 = (CONFIG_NOTIFICHE.ORARIO_NOTIFICA - ora) * 60 * 60 * 1000 - (minuti * 60 * 1000);
            if (msFinoAlle21 < 0) msFinoAlle21 += 24 * 60 * 60 * 1000;
            setTimeout(() => { controllaPresenzeGiornaliere(true); setInterval(() => controllaPresenzeGiornaliere(true), 24*60*60*1000); }, msFinoAlle21);
        }
        function programmaPuliziaTracciamento() {
            const ora = new Date().getHours(), minuti = new Date().getMinutes();
            let msFinoMezzanotte = (24 - ora) * 60 * 60 * 1000 - (minuti * 60 * 1000);
            setTimeout(() => { CONFIG_NOTIFICHE.NOTIFICHE_INVIATE = {}; programmaPuliziaTracciamento(); }, msFinoMezzanotte);
        }
        async function getRisultatiControllo() {
            const oggi = new Date(), giornoSettimana = oggi.getDay(), dataStr = oggi.toLocaleDateString('en-CA');
            const risultati = { piccoli: { deveAllenarsi: CONFIG_NOTIFICHE.GIORNI_PICCOLI.includes(giornoSettimana), presenze: 0, totaleAtleti: 0, notificaInviata: false }, grandi: { deveAllenarsi: CONFIG_NOTIFICHE.GIORNI_GRANDI.includes(giornoSettimana), presenze: 0, totaleAtleti: 0, notificaInviata: false } };
            const presenzeOggi = Object.values(presenzePerMese).flat().filter(p => p.data === dataStr);
            const atletiPiccoli = getAtletiFiltrati('piccoli'), atletiGrandi = getAtletiFiltrati('grandi');
            risultati.piccoli.totaleAtleti = atletiPiccoli.length; risultati.grandi.totaleAtleti = atletiGrandi.length;
            presenzeOggi.forEach(p => { const atleta = atletiCache.find(a => a.id === p.atleta_id); if (atleta) { const cat = (atleta.categoria || "").trim().toUpperCase(); if (CAT_PICCOLI.includes(cat)) risultati.piccoli.presenze++; else if (CAT_GRANDI.includes(cat)) risultati.grandi.presenze++; } });
            return risultati;
        }
        async function controllaPresenzeGiornaliere(forzaNotifica = false) {
            if (!CONFIG_NOTIFICHE.ABILITATE) return;
            const oggi = new Date(), giornoSettimana = oggi.getDay(), oraCorrente = oggi.getHours();
            if (giornoSettimana === 0) return;
            const risultati = await getRisultatiControllo();
            const inviaNotifica = forzaNotifica || oraCorrente >= CONFIG_NOTIFICHE.ORARIO_NOTIFICA;
            if (inviaNotifica) {
                const oggiStr = oggi.toDateString();
                if (risultati.piccoli.deveAllenarsi && risultati.piccoli.totaleAtleti > 0 && (CONFIG_NOTIFICHE.SOLO_SE_ZERO ? risultati.piccoli.presenze === 0 : true) && (CONFIG_NOTIFICHE.RENOTIFY || !CONFIG_NOTIFICHE.NOTIFICHE_INVIATE[`piccoli-${oggiStr}`])) { await inviaNotificaCategoria('piccoli', risultati.piccoli.totaleAtleti); CONFIG_NOTIFICHE.NOTIFICHE_INVIATE[`piccoli-${oggiStr}`] = true; }
                if (risultati.grandi.deveAllenarsi && risultati.grandi.totaleAtleti > 0 && (CONFIG_NOTIFICHE.SOLO_SE_ZERO ? risultati.grandi.presenze === 0 : true) && (CONFIG_NOTIFICHE.RENOTIFY || !CONFIG_NOTIFICHE.NOTIFICHE_INVIATE[`grandi-${oggiStr}`])) { await inviaNotificaCategoria('grandi', risultati.grandi.totaleAtleti); CONFIG_NOTIFICHE.NOTIFICHE_INVIATE[`grandi-${oggiStr}`] = true; }
                if (risultati.piccoli.deveAllenarsi && risultati.grandi.deveAllenarsi && (CONFIG_NOTIFICHE.SOLO_SE_ZERO ? (risultati.piccoli.presenze === 0 && risultati.grandi.presenze === 0) : true) && (CONFIG_NOTIFICHE.RENOTIFY || !CONFIG_NOTIFICHE.NOTIFICHE_INVIATE[`entrambi-${oggiStr}`])) { await inviaNotificaCompleta(risultati); CONFIG_NOTIFICHE.NOTIFICHE_INVIATE[`entrambi-${oggiStr}`] = true; }
            }
            aggiornaBadgeNotifiche(risultati);
        }
        async function inviaNotificaCategoria(categoria, totaleAtleti) {
            const oggi = new Date(), giorniItaliani = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'], giornoNome = giorniItaliani[oggi.getDay()], dataFormattata = oggi.toLocaleDateString('it-IT');
            let titolo, corpo;
            if (categoria === 'piccoli') { titolo = '👦 PICCOLI - Nessuna presenza registrata'; corpo = `Oggi ${giornoNome} ${dataFormattata} (giorno di allenamento) non ci sono presenze per i PICCOLI. ${totaleAtleti} atleti in lista.`; }
            else { titolo = '🏃 GRANDI - Nessuna presenza registrata'; corpo = `Oggi ${giornoNome} ${dataFormattata} (giorno di allenamento) non ci sono presenze per i GRANDI. ${totaleAtleti} atleti in lista.`; }
            await inviaNotificaPush(titolo, corpo, categoria);
        }
        async function inviaNotificaCompleta(risultati) {
            const oggi = new Date(), giorniItaliani = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'], giornoNome = giorniItaliani[oggi.getDay()], dataFormattata = oggi.toLocaleDateString('it-IT');
            const titolo = '⚠️ NESSUNA PRESENZA OGGI'; const corpo = `${giornoNome} ${dataFormattata} - Nessun atleta presente!\nPICCOLI: ${risultati.piccoli.totaleAtleti} atleti\nGRANDI: ${risultati.grandi.totaleAtleti} atleti`;
            await inviaNotificaPush(titolo, corpo, 'TUTTI');
        }
        async function inviaNotificaPush(titolo, corpo, categoria) {
            if (!('serviceWorker' in navigator) || Notification.permission !== 'granted') return;
            try { const registration = await navigator.serviceWorker.ready; await registration.showNotification(titolo, { body: corpo, icon: 'icon-192.png', badge: 'icon-72.png', vibrate: CONFIG_NOTIFICHE.VIBRAZIONE ? [200,100,200,100,200,100,400] : [], tag: `presenze-${categoria}-${new Date().toDateString()}`, renotify: CONFIG_NOTIFICHE.RENOTIFY, requireInteraction: true, actions: [{ action: 'open-piccoli', title: '👦 APRI PICCOLI' }, { action: 'open-grandi', title: '🏃 APRI GRANDI' }, { action: 'close', title: '⏰ RICORDA DOMANI' }], data: { categoria: categoria, timestamp: Date.now() } }); console.log('✅ Notifica inviata:', titolo); }
            catch(error) { console.error('Errore invio notifica:', error); }
        }
        function aggiornaBadgeNotifiche(risultati) {
            const oggi = new Date(), giorno = oggi.getDay();
            const piccoliBtn = document.querySelector('.btn-piccoli'), grandiBtn = document.querySelector('.btn-grandi');
            if (piccoliBtn) { if (CONFIG_NOTIFICHE.GIORNI_PICCOLI.includes(giorno) && risultati.piccoli.totaleAtleti > 0 && risultati.piccoli.presenze === 0) piccoliBtn.classList.add('attenzione'); else piccoliBtn.classList.remove('attenzione'); }
            if (grandiBtn) { if (CONFIG_NOTIFICHE.GIORNI_GRANDI.includes(giorno) && risultati.grandi.totaleAtleti > 0 && risultati.grandi.presenze === 0) grandiBtn.classList.add('attenzione'); else grandiBtn.classList.remove('attenzione'); }
        }
        function aggiornaStatoNotificheUI(stato) {
            const statoEl = document.getElementById('notification-status');
            if (!statoEl) return;
            if (stato) { statoEl.innerHTML = `🔔 ${stato}`; return; }
            if (!('Notification' in window)) { statoEl.innerHTML = '🔔 ❌ Non supportato'; return; }
            switch(Notification.permission) {
                case 'granted': statoEl.innerHTML = `🔔 ✅ Notifiche attive - Controllo ogni ora, notifica alle ${CONFIG_NOTIFICHE.ORARIO_NOTIFICA}:00`; break;
                case 'denied': statoEl.innerHTML = '🔔 ❌ Notifiche bloccate - Abilita dalle impostazioni'; break;
                default: statoEl.innerHTML = '🔔 ⏸️ Notifiche non attivate';
            }
        }

        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; const btn = document.getElementById('dropdown-install'); if (btn) btn.style.display = 'flex'; });
        window.addEventListener('appinstalled', () => { const btn = document.getElementById('dropdown-install'); if (btn) btn.style.display = 'none'; deferredPrompt = null; alert('✅ Grazie per aver installato Registro Presenze 2050!'); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { if (document.getElementById('notifiche-overlay').style.display === 'flex') chiudiMenuNotifiche(); } });
        window.onload = inizializza;
    </script>
</body>
